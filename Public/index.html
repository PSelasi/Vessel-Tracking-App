<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vessel Tracker</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: sans-serif;
      background: #0a0e1a;
      color: #e0e6f0;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: #0d1224;
      border-bottom: 1px solid #1e2a45;
      position: relative;
      z-index: 1000;
    }

    #topbar h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #7eb8f7;
    }

    #search-container {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 520px;
    }

    #search-input {
      width: 100%;
      border: 1px solid #1e2a45;
      border-radius: 999px;
      padding: 10px 16px;
      background: #08101d;
      color: #e0e6f0;
      outline: none;
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search-input:focus {
      border-color: #3ecf8e;
      box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.16);
    }

    .search-results {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      right: 0;
      background: #09101d;
      border: 1px solid #1e2a45;
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      padding: 6px 0;
      z-index: 1200;
    }

    .search-item {
      all: unset;
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 16px;
      color: #e0e6f0;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .search-item:hover {
      background: #101a2d;
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #8a9bb5;
      font-size: 11px;
      margin-top: 4px;
    }

    .search-empty {
      padding: 12px 16px;
      color: #8a9bb5;
    }

    #status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8a9bb5;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f05050;
      transition: background 0.4s;
    }

    #status-dot.live { background: #3ecf8e; }

    #vessel-count {
      font-size: 12px;
      color: #8a9bb5;
    }

    /* ── Map ── */
    #map {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 80px);
    }

    /* ── Info panel (click a vessel) ── */
    #info-panel {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      background: #0d1224ee;
      border: 1px solid #1e2a45;
      border-radius: 10px;
      padding: 14px 18px;
      min-width: 220px;
      display: none;
      backdrop-filter: blur(6px);
    }

    #info-panel h2 {
      font-size: 14px;
      font-weight: 600;
      color: #7eb8f7;
      margin-bottom: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 3px 0;
      border-bottom: 1px solid #1e2a4540;
      color: #8a9bb5;
    }

    .info-row span:last-child { color: #e0e6f0; }

    #info-panel .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      cursor: pointer;
      font-size: 14px;
      color: #8a9bb5;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <h1>VESSEL TRACKER</h1>

    <div id="search-container">
      <input id="search-input" type="search" placeholder="Search vessel name or MMSI..." autocomplete="off" />
      <div id="search-results" class="search-results"></div>
    </div>

    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>

    <div id="vessel-count">Vessels: <strong id="count">0</strong></div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Vessel info panel -->
  <div id="info-panel">
    <span class="close-btn" onclick="closePanel()">✕</span>
    <h2 id="panel-name">—</h2>
    <div class="info-row"><span>MMSI</span><span id="panel-mmsi">—</span></div>
    <div class="info-row"><span>Speed</span><span id="panel-speed">—</span></div>
    <div class="info-row"><span>Heading</span><span id="panel-heading">—</span></div>
    <div class="info-row"><span>Course</span><span id="panel-course">—</span></div>
    <div class="info-row"><span>Position</span><span id="panel-pos">—</span></div>
    <div class="info-row"><span>Last seen</span><span id="panel-time">—</span></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Socket.io client (served automatically by your server) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
